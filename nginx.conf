# ==============================================================================
# Shaghal Nginx Configuration: 301 Canonical Redirects & Performance
# Canonical target: https://shaghal.net
# ==============================================================================

# Option A: When running behind Reverse Proxy / Cloudflare / Docker (Port 80)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name shaghal.net www.shaghal.net _;

    # 1. Single-Hop 301: Redirect www to non-www
    if ($host = 'www.shaghal.net') {
        return 301 https://shaghal.net$request_uri;
    }

    # 2. Single-Hop 301: Redirect HTTP to HTTPS (when behind proxy/Cloudflare)
    if ($http_x_forwarded_proto = 'http') {
        return 301 https://shaghal.net$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html index.htm;

    # GZIP Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2
        application/vnd.ms-fontobject
        application/x-font-ttf;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Single Page Application (React) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
