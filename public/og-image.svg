<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#163D68"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="blueGlow1" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#247DB6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#247DB6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow2" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#163D68" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#163D68" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247DB6"/>
      <stop offset="100%" stop-color="#8AC7E7"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="ogBar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8AC7E7"/>
      <stop offset="100%" stop-color="#D7EDF6"/>
    </linearGradient>
    <linearGradient id="ogBar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#247DB6"/>
      <stop offset="100%" stop-color="#8AC7E7"/>
    </linearGradient>
    <linearGradient id="ogBar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#163D68"/>
      <stop offset="100%" stop-color="#247DB6"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#blueGlow1)"/>
  <rect width="1200" height="630" fill="url(#blueGlow2)"/>

  <!-- Subtle Grid Accent -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo Group -->
  <g transform="translate(100, 110)">
    <!-- Bar 1 -->
    <circle cx="20" cy="38" r="9" fill="#8AC7E7"/>
    <rect x="11" y="50" width="18" height="70" rx="9" fill="url(#ogBar1)"/>

    <!-- Bar 2 -->
    <circle cx="62" cy="24" r="11" fill="#247DB6"/>
    <rect x="51" y="38" width="22" height="82" rx="11" fill="url(#ogBar2)"/>

    <!-- Bar 3 (Tallest) -->
    <circle cx="108" cy="12" r="13" fill="#163D68"/>
    <rect x="95" y="28" width="26" height="92" rx="13" fill="url(#ogBar3)"/>
  </g>

  <!-- Brand Name -->
  <text x="260" y="195" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="78" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
    شغال <tspan fill="url(#textGrad)">| Shaghal</tspan>
  </text>

  <!-- Tagline / Headline -->
  <text x="100" y="320" font-family="'Cairo', 'Tajawal', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#F3F4F6">
    استوديو الأنظمة البرمجية والرقمية المخصصة
  </text>
  <text x="100" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#9CA3AF">
    Custom Digital Systems Studio — High Performance Software For Modern Businesses
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 435)">
    <!-- Pill 1: POS -->
    <g transform="translate(0, 0)">
      <rect width="280" height="52" rx="26" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="8" fill="#247DB6"/>
      <text x="50" y="33" font-family="'Cairo', sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">نظام نقاط البيع POS</text>
    </g>

    <!-- Pill 2: Clinics -->
    <g transform="translate(300, 0)">
      <rect width="310" height="52" rx="26" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="8" fill="#8AC7E7"/>
      <text x="50" y="33" font-family="'Cairo', sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">إدارة العيادات الطبية Clinic</text>
    </g>

    <!-- Pill 3: Warehouses -->
    <g transform="translate(630, 0)">
      <rect width="320" height="52" rx="26" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="8" fill="#163D68"/>
      <text x="50" y="33" font-family="'Cairo', sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">إدارة المخازن والعهد Warehouse</text>
    </g>
  </g>

  <!-- Footer Link & Badges -->
  <line x1="100" y1="535" x2="1100" y2="535" stroke="#334155" stroke-width="1"/>
  
  <text x="100" y="580" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#247DB6">
    🌐 https://shaghal.net
  </text>

  <text x="1100" y="580" text-anchor="end" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#64748B">
    سرعة فائقة • تشغيل دون انقطاع • دعم فني مخصص
  </text>
</svg>
