<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>

    <!-- Emerald signature gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#21C87A"/>
    </linearGradient>

    <!-- Subtle neon glow for the signature bar -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#21C87A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- High-contrast rounded squircle container (Visible on dark & light Google Search modes) -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#sqBg)" stroke="#21C87A" stroke-width="8" stroke-opacity="0.25"/>

  <!-- Bar 1 (Shortest / Electric Blue / Left) -->
  <circle cx="150" cy="190" r="28" fill="#38BDF8"/>
  <rect x="122" y="228" width="56" height="170" rx="28" fill="#1E3A8A"/>

  <!-- Bar 2 (Medium / Deep Tech Blue / Middle) -->
  <circle cx="256" cy="150" r="32" fill="#0EA5E9"/>
  <rect x="224" y="192" width="64" height="206" rx="32" fill="#0D2240"/>

  <!-- Bar 3 (Tallest / Signature Emerald Green / Right) -->
  <g filter="url(#emeraldGlow)">
    <circle cx="362" cy="110" r="36" fill="#4EEDB0"/>
    <rect x="326" y="156" width="72" height="242" rx="36" fill="url(#emeraldGrad)"/>
  </g>
</svg>
