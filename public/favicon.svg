<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp emerald gradient for the signature tallest bar -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1DB96C"/>
      <stop offset="100%" stop-color="#21C87A"/>
    </linearGradient>
  </defs>

  <!-- High-contrast clean white squircle container (Visible on dark & light browser tabs, search results & mobile home screens) -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Bar 1 (Shortest / Brand Dark Navy #101828) -->
  <circle cx="146" cy="200" r="31" fill="#101828"/>
  <rect x="115" y="236" width="62" height="169" rx="31" fill="#101828"/>

  <!-- Bar 2 (Medium / Deep Tech Navy #0D2240) -->
  <circle cx="256" cy="159" r="35" fill="#0D2240"/>
  <rect x="223" y="200" width="66" height="205" rx="33" fill="#0D2240"/>

  <!-- Bar 3 (Tallest / Signature Emerald Green #21C87A) -->
  <circle cx="366" cy="118" r="39" fill="#21C87A"/>
  <rect x="331" y="164" width="70" height="241" rx="35" fill="url(#emeraldGrad)"/>
</svg>
